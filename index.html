<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;font-family:system-ui,sans-serif;color:#cfd6e4}
  #scene{position:fixed;inset:0;width:100%;height:100%}
  #cam{position:fixed;top:0;left:0;width:100%;height:30%;object-fit:cover;transform:scaleX(-1);opacity:.9}
  #ov{position:fixed;top:0;left:0;width:100%;height:30%;transform:scaleX(-1);pointer-events:none}
  #hud{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;font-size:13px;text-align:center;
       background:linear-gradient(transparent,#000a);}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
         background:#0b0d12ee;z-index:5;text-align:center;padding:24px}
  button{font-size:18px;padding:12px 28px;border-radius:999px;border:0;background:#2fbf71;color:#04210f;font-weight:700;cursor:pointer}
  .g{opacity:.8;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="ov"></canvas>
<canvas id="scene"></canvas>
<div id="hud">Starting…</div>
<div id="start">
  <div style="font-size:26px;font-weight:700">🎄 ASCII Christmas Tree</div>
  <div class="g">
    ✋ Open palm = grow the tree<br>
    ☝️ One finger = rainbow lights<br>
    🙌 Two open hands = more lights + presents<br>
    🫶 Heart with both hands = reindeer<br>
    ✊ Fist = reset
  </div>
  <button id="go">Enable camera</button>
  <div class="g" id="msg">No camera? Use the keyboard: 1 grow · 2 lights · 3 presents · 4 reindeer · 0 reset</div>
</div>

<script type="module">
import {HandLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const cv = $('scene'), ctx = cv.getContext('2d');
const ov = $('ov'), octx = ov.getContext('2d');
const video = $('cam'), hud = $('hud');

/* ---------- state (targets are set by gestures, values ease toward them) ---------- */
const T = {grow:0, lights:0, gifts:0, deer:0};
const S = {grow:0, lights:0, gifts:0, deer:0};
let gestureName = 'none';

/* ---------- scene ---------- */
const CH = 9, CW = 6;          // cell size in px
let cols, rows, W, H;
function resize(){
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  ov.width = innerWidth; ov.height = innerHeight*0.3;
  cols = Math.floor(W/CW); rows = Math.floor(H/CH);
  ctx.font = `${CH+1}px monospace`; ctx.textBaseline = 'top';
}
addEventListener('resize', resize); resize();

const hash = (x,y) => { let n = Math.sin(x*127.1 + y*311.7)*43758.5453; return n - Math.floor(n); };
const snow = Array.from({length:140}, () => ({x:Math.random(), y:Math.random(), v:.02+Math.random()*.05, c:Math.random()<.3?'*':'.'}));

const DEER = [
 "  \\|/ \\|/   ",
 "   \\\\ //     ",
 "    (oo)__   ",
 "   /(  )__\\  ",
 "    ||  ||   "
];

function drawScene(t){
  ctx.clearRect(0,0,W,H);
  const topBar = Math.floor(rows*0.30);
  const baseY = rows - 6;
  const maxH = (baseY - topBar - 4);
  const treeH = Math.max(0, maxH * S.grow);
  const cx = Math.floor(cols/2) - 3;
  const treeTop = baseY - treeH;
  const maxW = Math.min(cols*0.42, treeH*0.62);

  // snow
  ctx.fillStyle = '#dfe8ff';
  for (const s of snow){
    s.y += s.v*0.016*6; s.x += Math.sin(t/900 + s.y*9)*0.0004;
    if (s.y > 1){ s.y = 0.28; s.x = Math.random(); }
    ctx.globalAlpha = .75; ctx.fillText(s.c, s.x*W, s.y*H);
  }
  ctx.globalAlpha = 1;

  // ground
  for (let x=0; x<cols; x++){
    for (let y=baseY+2; y<rows; y++){
      const h = hash(x,y);
      if (h < (y===baseY+2 ? .75 : .35)){
        ctx.fillStyle = `rgba(214,190,110,${.25+h*.4})`;
        ctx.fillText(h<.5?'.':':', x*CW, y*CH);
      }
    }
  }

  if (S.grow > 0.02){
    // trunk
    for (let y=baseY; y<baseY+3; y++) for (let x=cx-1; x<=cx+1; x++){
      ctx.fillStyle = '#6b4a2b'; ctx.fillText('#', x*CW, y*CH);
    }
    // tree body
    const chars = '.:+*oO#@';
    for (let y=Math.floor(treeTop); y<baseY; y++){
      const tt = (y - treeTop) / Math.max(1,treeH);          // 0 top .. 1 bottom
      const tier = (tt*4) % 1;                                // 4 tiers
      const half = maxW * (0.08 + 0.92*tt) * (0.72 + 0.28*tier);
      for (let x=Math.floor(cx-half); x<=Math.ceil(cx+half); x++){
        const edge = 1 - Math.abs(x-cx)/Math.max(1,half);
        const h = hash(x,y);
        if (h > .35 + edge*.6) continue;
        const lit = h < 0.07*S.lights + 0.015;
        if (lit){
          const hue = ((x*5 + y*9 + t*0.06) % 360);
          ctx.fillStyle = S.lights>0.15 ? `hsl(${hue},95%,62%)` : (h<.01?'#ff4d4d':'#ffd86b');
          ctx.fillText('@', x*CW, y*CH);
        } else {
          const g = 120 + Math.floor((edge*.5+h*.5)*110);
          ctx.fillStyle = `rgb(${40+Math.floor(h*50)},${g},${70+Math.floor(h*40)})`;
          ctx.fillText(chars[Math.min(7, Math.floor((edge*.6+h*.4)*8))], x*CW, y*CH);
        }
      }
    }
    // star
    if (S.grow > .85){
      const p = .6 + .4*Math.sin(t/260);
      ctx.fillStyle = `rgba(255,224,120,${p})`;
      ctx.fillText('*', cx*CW, (treeTop-1)*CH);
      ctx.fillStyle = `rgba(255,224,120,${p*.5})`;
      for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1],[0,-2],[0,2]]) ctx.fillText('+', (cx+dx)*CW, (treeTop-1+dy)*CH);
    }
  }

  // presents
  if (S.gifts > .05){
    const cols2 = ['#e0475b','#3a7bd5','#e8b93c','#7a5cd6','#2fbf71'];
    const n = Math.floor(5*S.gifts);
    for (let i=0;i<n;i++){
      const gx = cx - 14 + i*6 + (i%2), gw = 4+(i%2), gh = 2+(i%3);
      ctx.fillStyle = cols2[i%5];
      for (let y=0;y<gh;y++) for (let x=0;x<gw;x++) ctx.fillText(x===Math.floor(gw/2)||y===0?'+':'#', (gx+x)*CW, (baseY+3-gh+y)*CH);
    }
  }

  // reindeer
  if (S.deer > .05 && S.grow > .4){
    ctx.globalAlpha = Math.min(1, S.deer);
    ctx.fillStyle = '#ffffff';
    const dy = Math.floor(treeTop + treeH*0.55);
    DEER.forEach((line,i)=> ctx.fillText(line, (cx-6)*CW, (dy+i)*CH));
    ctx.globalAlpha = 1;
  }
}

/* ---------- gestures ---------- */
const d = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
function fingersUp(lm){
  const w = lm[0];
  const pairs = [[8,6],[12,10],[16,14],[20,18]];
  let n = pairs.filter(([tip,pip]) => d(lm[tip],w) > d(lm[pip],w)*1.12).length;
  const thumb = d(lm[4], lm[17]) > d(lm[3], lm[17])*1.05 && d(lm[4], lm[5]) > .06;
  return {n, thumb, index: d(lm[8],w) > d(lm[6],w)*1.12 && n===1};
}

function classify(hands){
  if (!hands.length) return 'none';
  if (hands.length === 2){
    const [a,b] = hands;
    const heart = d(a[8],b[8]) < .09 && d(a[4],b[4]) < .09;
    if (heart) return 'heart';
    const fa = fingersUp(a), fb = fingersUp(b);
    if (fa.n>=4 && fb.n>=4) return 'two';
  }
  const f = fingersUp(hands[0]);
  if (f.n >= 4) return 'open';
  if (f.index) return 'point';
  if (f.n === 0 && !f.thumb) return 'fist';
  return 'other';
}

let fistFrames = 0;
function applyGesture(g){
  gestureName = g;
  if (g !== 'fist') fistFrames = 0;
  if (g==='open'){ T.grow = 1; }
  else if (g==='point'){ T.grow = Math.max(T.grow,1); T.lights = 1; }
  else if (g==='two'){ T.grow = 1; T.lights = 1; T.gifts = 1; }
  else if (g==='heart'){ T.grow = 1; T.lights = 1; T.gifts = 1; T.deer = 1; }
  else if (g==='fist'){ if (++fistFrames > 8){ T.grow = T.lights = T.gifts = T.deer = 0; } }
  else if (g==='none'){ T.deer = Math.max(0, T.deer - 0.01); }
}

/* ---------- overlay ---------- */
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHands(hands){
  octx.clearRect(0,0,ov.width,ov.height);
  octx.strokeStyle='#fff'; octx.fillStyle='#fff'; octx.lineWidth=2;
  const vw = video.videoWidth||1, vh = video.videoHeight||1;
  // match object-fit: cover
  const sc = Math.max(ov.width/vw, ov.height/vh);
  const ox = (ov.width - vw*sc)/2, oy = (ov.height - vh*sc)/2;
  const P = p => [p.x*vw*sc+ox, p.y*vh*sc+oy];
  for (const lm of hands){
    octx.beginPath();
    for (const [a,b] of CONN){ const [x1,y1]=P(lm[a]),[x2,y2]=P(lm[b]); octx.moveTo(x1,y1); octx.lineTo(x2,y2); }
    octx.stroke();
    for (const p of lm){ const [x,y]=P(p); octx.beginPath(); octx.arc(x,y,3,0,7); octx.fill(); }
  }
}

/* ---------- main loop ---------- */
let landmarker = null, lastVideoT = -1;
function loop(t){
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoT){
    lastVideoT = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    drawHands(res.landmarks);
    applyGesture(classify(res.landmarks));
  }
  for (const k in S) S[k] += (T[k]-S[k]) * (k==='grow'?0.035:0.06);
  drawScene(t);
  hud.textContent = (landmarker ? `Gesture: ${gestureName}` : 'Keyboard mode') +
    `  ·  grow ${(S.grow*100|0)}%  lights ${(S.lights*100|0)}%`;
  requestAnimationFrame(loop);
}

addEventListener('keydown', e => {
  if (e.key==='1') T.grow = 1;
  if (e.key==='2'){ T.grow = 1; T.lights = 1; }
  if (e.key==='3'){ T.grow = 1; T.gifts = 1; }
  if (e.key==='4'){ T.grow = 1; T.deer = T.deer?0:1; }
  if (e.key==='0'){ T.grow=T.lights=T.gifts=T.deer=0; }
});

async function startCamera(){
  $('go').disabled = true; $('msg').textContent = 'Loading hand tracker…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:640, height:480}, audio:false});
    video.srcObject = stream; await video.play();
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(fileset, {
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:"GPU"},
      runningMode:"VIDEO", numHands:2
    });
    $('start').remove();
  } catch(err){
    $('msg').textContent = 'Camera/tracker unavailable (' + (err.message||err) + '). Using keyboard: 1 grow · 2 lights · 3 presents · 4 reindeer · 0 reset';
    $('go').textContent = 'Continue with keyboard';
    $('go').disabled = false;
    $('go').onclick = () => $('start').remove();
  }
}
$('go').onclick = startCamera;
requestAnimationFrame(loop);
</script>
</body>
</html>
